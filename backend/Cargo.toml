[package]
name = "studio-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
sha2 = "0.10.9"
fs2 = "0.4.3"
tempfile = "3.23.0"
jsonschema = { version = "0.33.0", default-features = false }
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1.41"
zeroize = "1.8.2"

[dev-dependencies]
